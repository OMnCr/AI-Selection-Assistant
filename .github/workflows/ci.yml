name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify manifest and locales
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-selection-assistant
          path: dist/*.zip
          if-no-files-found: error
